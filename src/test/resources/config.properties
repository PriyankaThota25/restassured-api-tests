base.uri=https://jsonplaceholder.typicode.com

# OAuth2 client-credentials. Override secrets with env vars AUTH_CLIENT_ID / AUTH_CLIENT_SECRET
# (or -Dauth.client.id / -Dauth.client.secret); never commit real secrets.
auth.token.url=https://auth.example.com/oauth/token
auth.client.id=change-me
auth.client.secret=change-me
auth.scope=
# Refresh this many seconds before the token really expires
auth.expiry.skew.seconds=30
